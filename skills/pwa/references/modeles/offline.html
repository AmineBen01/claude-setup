<!doctype html>
<html lang="fr-CH">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#5b0000" />
    <meta name="robots" content="noindex" />
    <title>Pas de connexion · Apps ?</title>
    <style>
      :root {
        --bordeaux: #5b0000;
        --creme: #fff8e7;
        --rose: #d9b8aa;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        background: var(--creme);
        color: #2b0b08;
        font-family: "Space Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
        font-size: 1rem;
      }
      header {
        background: var(--bordeaux);
        color: var(--creme);
        padding: calc(env(safe-area-inset-top) + 1rem) max(1rem, env(safe-area-inset-right)) 1rem max(1rem, env(safe-area-inset-left));
        font-weight: 700;
        text-transform: uppercase;
      }
      main {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        padding: 2rem max(1rem, env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 2rem) max(1rem, env(safe-area-inset-left));
        text-align: center;
      }
      .tile {
        width: 96px;
        height: 96px;
        border-radius: 28%;
        background: var(--rose);
      }
      h1 {
        margin: 0;
        color: var(--bordeaux);
        font-size: 2rem;
        text-transform: uppercase;
      }
      p {
        margin: 0;
        max-width: 22rem;
        font-size: 1.125rem;
      }
      button {
        min-height: 3.5rem;
        padding: 0 1.5rem;
        border: 0;
        border-radius: 0.75rem;
        background: var(--bordeaux);
        color: var(--creme);
        font: inherit;
        font-size: 1.125rem;
        font-weight: 700;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 3px solid var(--rose);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <header>Et si on parlait des apps&nbsp;?</header>
    <main>
      <div class="tile" aria-hidden="true"></div>
      <h1>Pas de connexion</h1>
      <p>Vérifiez le Wi-Fi ou les données mobiles, puis réessayez.</p>
      <button type="button" onclick="location.reload()">Réessayer</button>
    </main>
  </body>
</html>
